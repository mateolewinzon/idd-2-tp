# Nombre de proyecto fijo: sin esto Compose lo deriva del nombre del directorio,
# y renombrar la carpeta dejaria huerfano el volumen con los datos.
name: fixture2030

services:
  mongo:
    image: mongo:7.0
    container_name: fixture2030-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - fixture2030_data:/data/db
      # No se usa /docker-entrypoint-initdb.d: solo se ejecuta cuando el volumen
      # esta vacio, asi que no permitiria demostrar que la carga es repetible.
      - ./mongo:/scripts:ro
      - ./datos:/datos:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  fixture2030_data:

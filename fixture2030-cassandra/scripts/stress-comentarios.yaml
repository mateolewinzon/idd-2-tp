# Perfil de cassandra-stress para la tabla caliente del Hito 6.
#
# Modela siete partidos y treinta bloques temporales por partido. La
# distribución EXTREME concentra más operaciones en los partidos de mayor
# audiencia. comentario_id dispone de 10.000 posiciones por partición
# (hasta 2,1 millones en las 210 combinaciones) para minimizar colisiones sin
# agotar el heap del propio generador.

specname: fixture2030_comments
keyspace: fixture2030_comentarios
table: comentarios_feed

columnspec:
  - name: partido_id
    size: fixed(18)
    population: extreme(1..7,0.35)
  - name: bloque_temporal
    population: uniform(1..30)
  - name: comentario_id
    cluster: fixed(10000)
  - name: idioma
    size: fixed(2)
    population: uniform(1..5)
  - name: usuario_id
    size: fixed(12)
    population: uniform(1..100000)
  - name: nombre_usuario
    size: uniform(8..24)
    population: uniform(1..100000)
  - name: texto
    size: gaussian(20..280,100,45)
  - name: estado_moderacion
    size: uniform(7..10)
    population: extreme(1..3,0.15)

insert:
  partitions: fixed(1)
  select: fixed(1)/10000
  batchtype: UNLOGGED

# Cassandra 5 requiere que los perfiles de usuario declaren al menos una
# consulta aunque el workload solicitado sea exclusivamente de inserción.
queries:
  ultimo_comentario:
    cql: SELECT * FROM comentarios_feed WHERE partido_id = ? AND bloque_temporal = ? LIMIT 1
    fields: samerow

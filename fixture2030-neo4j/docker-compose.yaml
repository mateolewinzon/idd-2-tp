services:
  neo4j:
    image: neo4j:latest
    container_name: fixture2030-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./import:/var/lib/neo4j/import

volumes:
  neo4j_data:
  neo4j_logs:

services:
  redis:
    image: redis:7.4-alpine
    container_name: fixture2030-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "60"
      - "1000"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-ttl
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  redis_data:

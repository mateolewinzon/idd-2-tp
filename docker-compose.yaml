# Stack unificado de bases del Fixture 2030.
# Ejecutar desde este directorio: docker compose up -d
# Conserva los puertos, directorios persistentes y datos de los Compose por módulo.
name: fixture2030

services:
  mongo:
    image: mongo:7.0
    container_name: fixture2030-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - fixture2030_data:/data/db
      - ./fixture2030-mongo/mongo:/scripts:ro
      - ./fixture2030-mongo/datos:/datos:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  neo4j:
    image: neo4j:latest
    container_name: fixture2030-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password123
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./fixture2030-neo4j/import:/var/lib/neo4j/import

  cassandra:
    image: cassandra:latest
    container_name: fixture2030-cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: Fixture2030_Cassandra
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    ports:
      - "9042:9042"
    volumes:
      - ${HOME}/docker/data/cassandra:/var/lib/cassandra
      - ./fixture2030-cassandra/scripts:/scripts:ro

  redis:
    image: redis:7.4-alpine
    container_name: fixture2030-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "60"
      - "1000"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-ttl
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  influxdb:
    image: influxdb:3-core
    container_name: fixture2030-influxdb
    restart: unless-stopped
    depends_on:
      influxdb-token-init:
        condition: service_completed_successfully
    environment:
      INFLUXDB3_NODE_ID: node1
      INFLUXDB3_OBJECT_STORE: file
      INFLUXDB3_DATA_DIR: /var/lib/influxdb3
      INFLUXDB3_ADMIN_TOKEN_FILE: /var/lib/influxdb3/admin_token.json
      INFLUXDB3_QUERY_FILE_LIMIT: "50000"
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - ${HOME}/docker/data/influxdb:/var/lib/influxdb3
      - ./fixture2030-influxdb/scripts:/scripts:ro

  influxdb-token-init:
    image: influxdb:3-core
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "if [ ! -s /var/lib/influxdb3/admin_token.json ]; then influxdb3 create token --admin --offline --output-file /var/lib/influxdb3/admin_token.json >/dev/null; fi"
    volumes:
      - ${HOME}/docker/data/influxdb:/var/lib/influxdb3

volumes:
  fixture2030_data:
    name: fixture2030_fixture2030_data
  neo4j_data:
    name: fixture2030-neo4j_neo4j_data
  neo4j_logs:
    name: fixture2030-neo4j_neo4j_logs
  redis_data:
    external: true
    name: fixture2030-redis_redis_data

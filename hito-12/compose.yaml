name: fixture2030-hito12
services:
  mongo:
    image: mongo:7.0
    cpus: 1
    mem_limit: 512m
    ports: ["127.0.0.1:57017:27017"]
    volumes: ["mongo_hito12:/data/db"]
  redis:
    image: redis:7.4-alpine
    cpus: 0.5
    mem_limit: 128m
    ports: ["127.0.0.1:56379:6379"]
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
volumes:
  mongo_hito12:
